name: Mirror DDD to GitHub

on:
  schedule:

    - cron: "19 1 * * *"     # nightly 01:19 UTC

  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    outputs:
      changed: ${{ steps.check.outputs.changed }} 
    env:
      UPSTREAM: https://https.https.git.savannah.gnu.org/git/ddd.git
      TARGET: eickeler/DDD
      GIT_TERMINAL_PROMPT: "0"

    steps:
      - name: Select a working Savannah HTTPS mirror
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail

          host="https.git.savannah.gnu.org"

          for attempt in 1 2 3; do
            # Obtain the currently advertised IPv4 addresses.
            mapfile -t addresses < <(
              getent ahostsv4 "$host" |
                awk '{print $1}' |
                sort -u
            )

            for ip in "${addresses[@]}"; do
              echo "Testing Savannah mirror at $ip"

              # Override DNS resolution, but retain the hostname
              # for TLS certificate verification.
              if timeout 60s git \
                -c "http.curloptResolve=${host}:443:${ip}" \
                ls-remote --heads --tags "$UPSTREAM" > /dev/null
              then
                # Apply the selection to subsequent Git operations
                # for this runner only.
                git config --global --replace-all \
                  http.curloptResolve "${host}:443:${ip}"

                echo "Selected working mirror: $ip"
                exit 0
              fi
            done

            if (( attempt < 3 )); then
              delay=$((60 * attempt + RANDOM % 30))
              echo "No working IPv4 mirror found; retrying in ${delay}s."
              sleep "$delay"
            fi
          done

          echo "No working advertised IPv4 mirror found." >&2
          exit 1
          
      - name: Check refs and clone with backoff
        id: check
        shell: bash
        run: |
          set -euo pipefail

          # Tolerate genuinely slow transfers.
          # These settings do not handle HTTP 502 errors.
          git config --global http.lowSpeedLimit 1
          git config --global http.lowSpeedTime 180

          retry() {
            local attempt rc=1 delay

            for attempt in 1 2 3 4 5; do
              if "$@"; then
                return 0
              else
                rc=$?
              fi

              if (( attempt == 5 )); then
                echo "Failed after 5 attempts." >&2
                return "$rc"
              fi

              # Approximately 1, 2, 4, and 8 minutes, plus jitter.
              delay=$((60 * (2 ** (attempt - 1)) + RANDOM % 30))
              echo "Attempt $attempt failed; retrying in ${delay}s." >&2
              sleep "$delay"
            done
          }

          read_refs() {
            # Truncate the file on each attempt so failed attempts
            # cannot leave partial output in the comparison.
            git ls-remote --heads --tags "$1" > "$2"
          }

          clone_upstream() {
            # Remove any incomplete clone before retrying.
            rm -rf upstream.git
            git clone --mirror "$UPSTREAM" upstream.git
          }

          upstream_refs="$RUNNER_TEMP/upstream.refs"
          target_refs="$RUNNER_TEMP/target.refs"

          retry read_refs "$UPSTREAM" "$upstream_refs"
          retry read_refs "https://github.com/${TARGET}.git" "$target_refs"

          # A populated upstream should never return an empty ref list.
          if [[ ! -s "$upstream_refs" ]]; then
            echo "Upstream returned no refs; refusing to mirror." >&2
            exit 1
          fi

          LC_ALL=C sort -o "$upstream_refs" "$upstream_refs"
          LC_ALL=C sort -o "$target_refs" "$target_refs"

          if cmp -s "$upstream_refs" "$target_refs"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected; skipping mirror."
            echo "Upstream and GitHub refs are identical." \
              >> "$GITHUB_STEP_SUMMARY"
          else
            retry clone_upstream
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected; upstream cloned successfully."
          fi

      - name: Push to GitHub mirror

        if: steps.check.outputs.changed == 'true'
        working-directory: upstream.git
        env:
          PAT: ${{ secrets.MIRROR_PUSH_TOKEN }}   # fine-grained PAT
        run: |
          git remote add github "https://x-access-token:${PAT}@github.com/${{ env.TARGET }}.git"
          git push --mirror github

  tarball:
    needs: mirror
    if: needs.mirror.outputs.changed == 'true'  # guard at job level
    uses: ./.github/workflows/createtarball.yml
    permissions:
      contents: write

  appimage_amd64:
    needs: mirror
    if: needs.mirror.outputs.changed == 'true'
    uses: ./.github/workflows/createappimageamd64.yml
    permissions:
      contents: write

  deb_ubuntu_amd64:
    needs: mirror
    if: needs.mirror.outputs.changed == 'true'
    uses: ./.github/workflows/createdebubuntuamd64.yml
    permissions:
      contents: write

  rpm_opensuse_x86_64:
    needs: mirror
    if: needs.mirror.outputs.changed == 'true'
    uses: ./.github/workflows/createrpmopenSUSE16.0x86_64.yml
    permissions:
      contents: write

  rpm_rhel10_x86_64:
    needs: mirror
    if: needs.mirror.outputs.changed == 'true'
    uses: ./.github/workflows/createrpmrhel10x86_64.yml
    permissions:
      contents: write
