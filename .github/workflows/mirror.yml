name: Mirror DDD to GitHub

on:
  schedule:

    - cron: "19 1 * * *"     # nightly 01:19 UTC

  workflow_dispatch:
    inputs:
      force:
        description: Build and publish even if upstream is unchanged (e.g. after a failed build)
        type: boolean
        default: false

# Builders only need read access; the publish job raises this to write.
permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    outputs:
      changed: ${{ steps.check.outputs.changed }}
      # Builders and publish run when upstream changed or a rebuild is forced.
      build: ${{ steps.check.outputs.changed == 'true' || inputs.force == true }}
      date: ${{ steps.check.outputs.date }}
      commit: ${{ steps.check.outputs.commit }}
    env:
      UPSTREAM: https://https.git.savannah.gnu.org/git/ddd.git
      TARGET: eickeler/DDD
      GIT_TERMINAL_PROMPT: "0"

    steps:
      - name: Select a working Savannah HTTPS mirror
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail

          host="https.git.savannah.gnu.org"

          for attempt in 1 2 3; do
            # Obtain the currently advertised IPv4 addresses.
            mapfile -t addresses < <(
              getent ahostsv4 "$host" |
                awk '{print $1}' |
                sort -u
            )

            for ip in "${addresses[@]}"; do
              echo "Testing Savannah mirror at $ip"

              # Override DNS resolution, but retain the hostname
              # for TLS certificate verification.
              if timeout 60s git \
                -c "http.curloptResolve=${host}:443:${ip}" \
                ls-remote --heads --tags "$UPSTREAM" > /dev/null
              then
                # Apply the selection to subsequent Git operations
                # for this runner only.
                git config --global --replace-all \
                  http.curloptResolve "${host}:443:${ip}"

                echo "Selected working mirror: $ip"
                exit 0
              fi
            done

            if (( attempt < 3 )); then
              delay=$((60 * attempt + RANDOM % 30))
              echo "No working IPv4 mirror found; retrying in ${delay}s."
              sleep "$delay"
            fi
          done

          echo "No working advertised IPv4 mirror found." >&2
          exit 1
          
      - name: Check refs and clone with backoff
        id: check
        shell: bash
        run: |
          set -euo pipefail

          # Tolerate genuinely slow transfers.
          # These settings do not handle HTTP 502 errors.
          git config --global http.lowSpeedLimit 1
          git config --global http.lowSpeedTime 180

          retry() {
            local attempt rc=1 delay

            for attempt in 1 2 3 4 5; do
              if "$@"; then
                return 0
              else
                rc=$?
              fi

              if (( attempt == 5 )); then
                echo "Failed after 5 attempts." >&2
                return "$rc"
              fi

              # Approximately 1, 2, 4, and 8 minutes, plus jitter.
              delay=$((60 * (2 ** (attempt - 1)) + RANDOM % 30))
              echo "Attempt $attempt failed; retrying in ${delay}s." >&2
              sleep "$delay"
            done
          }

          read_refs() {
            # Truncate the file on each attempt so failed attempts
            # cannot leave partial output in the comparison.
            git ls-remote --heads --tags "$1" > "$2"
          }

          clone_upstream() {
            # Remove any incomplete clone before retrying.
            rm -rf upstream.git
            git clone --mirror "$UPSTREAM" upstream.git
          }

          # One UTC date for the whole run; used as the nightly release tag.
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

          upstream_refs="$RUNNER_TEMP/upstream.refs"
          target_refs="$RUNNER_TEMP/target.refs"

          retry read_refs "$UPSTREAM" "$upstream_refs"
          retry read_refs "https://github.com/${TARGET}.git" "$target_refs"

          # A populated upstream should never return an empty ref list.
          if [[ ! -s "$upstream_refs" ]]; then
            echo "Upstream returned no refs; refusing to mirror." >&2
            exit 1
          fi

          LC_ALL=C sort -o "$upstream_refs" "$upstream_refs"
          LC_ALL=C sort -o "$target_refs" "$target_refs"

          # The master commit being mirrored (also valid for forced
          # rebuilds, when nothing is cloned).
          commit="$(awk '$2 == "refs/heads/master" {print $1}' "$upstream_refs")"
          if [[ -z "$commit" ]]; then
            echo "Upstream has no master branch" >&2
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

          if cmp -s "$upstream_refs" "$target_refs"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected; skipping mirror."
            echo "Upstream and GitHub refs are identical." \
              >> "$GITHUB_STEP_SUMMARY"
          else
            retry clone_upstream
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected; upstream cloned successfully."
          fi

      - name: Push to GitHub mirror

        if: steps.check.outputs.changed == 'true'
        working-directory: upstream.git
        env:
          PAT: ${{ secrets.MIRROR_PUSH_TOKEN }}   # fine-grained PAT
        run: |
          git remote add github "https://x-access-token:${PAT}@github.com/${{ env.TARGET }}.git"
          git push --mirror github

  # The builders only upload artifacts named package-*.
  # All publishing happens in the publish job below.
  tarball:
    needs: mirror
    if: needs.mirror.outputs.build == 'true'  # guard at job level
    uses: ./.github/workflows/createtarball.yml

  appimage_amd64:
    needs: mirror
    if: needs.mirror.outputs.build == 'true'
    uses: ./.github/workflows/createappimageamd64.yml

  deb_ubuntu_amd64:
    needs: mirror
    if: needs.mirror.outputs.build == 'true'
    uses: ./.github/workflows/createdebubuntuamd64.yml

  rpm_opensuse_x86_64:
    needs: mirror
    if: needs.mirror.outputs.build == 'true'
    uses: ./.github/workflows/createrpmopenSUSE16.0x86_64.yml

  rpm_rhel10_x86_64:
    needs: mirror
    if: needs.mirror.outputs.build == 'true'
    uses: ./.github/workflows/createrpmrhel10x86_64.yml

  publish:
    needs:
      - mirror
      - tarball
      - appimage_amd64
      - deb_ubuntu_amd64
      - rpm_opensuse_x86_64
      - rpm_rhel10_x86_64
    # Run even if some builders failed, so the successful ones are still
    # published; the job fails at the end to make the failures visible.
    if: ${{ !cancelled() && needs.mirror.outputs.build == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    env:
      GH_TOKEN: ${{ github.token }}
      OWNER_REPO: ${{ github.repository }}
      DATE: ${{ needs.mirror.outputs.date }}
      COMMIT: ${{ needs.mirror.outputs.commit }}
      NEEDS: ${{ toJSON(needs) }}

    steps:
      - name: Download all nightly artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Publish nightly release
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob
          FILES=(dist/*)

          if (( ${#FILES[@]} == 0 )); then
            echo "No nightly artifacts were downloaded" >&2
            exit 1
          fi

          TAG="nightly-${DATE}"

          # Per-builder results, excluding the mirror job itself.
          mapfile -t RESULTS < <(
            jq -r 'to_entries[]
                   | select(.key != "mirror")
                   | "\(.key)\t\(.value.result)"' <<< "$NEEDS"
          )

          FAILED=()
          {
            echo "Nightly builds of GNU DDD from the master branch."
            echo
            echo "Source commit: https://github.com/eickeler/DDD/commit/${COMMIT}"
            echo
            echo "| Build | Result |"
            echo "|---|---|"
            for line in "${RESULTS[@]}"; do
              job="${line%%$'\t'*}"
              result="${line#*$'\t'}"
              echo "| ${job} | ${result} |"
              [[ "$result" == success ]] || FAILED+=("$job")
            done
            echo
            echo "The \"Source code\" archives below are generated by GitHub"
            echo "from the workflow repository, not from DDD. Use the"
            echo "ddd-nightly-*.tar.gz asset for the DDD source."
          } > release-notes.md

          cat release-notes.md

          if gh release view "$TAG" --repo "$OWNER_REPO" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --repo "$OWNER_REPO" \
              --notes-file release-notes.md
          else
            gh release create "$TAG" \
              --repo "$OWNER_REPO" \
              --title "DDD Nightly $DATE" \
              --notes-file release-notes.md \
              --prerelease \
              --target "$GITHUB_SHA"
          fi

          # Replacing assets is intended for nightlies: a second run on the
          # same day supersedes the earlier build.
          gh release upload "$TAG" \
            --repo "$OWNER_REPO" \
            "${FILES[@]}" \
            --clobber

          {
            echo "Published ${#FILES[@]} file(s) to ${TAG}:"
            printf -- '- %s\n' "${FILES[@]##*/}"
          } >> "$GITHUB_STEP_SUMMARY"

          if (( ${#FAILED[@]} > 0 )); then
            echo "::error::Builds failed or were skipped: ${FAILED[*]}"
            exit 1
          fi
