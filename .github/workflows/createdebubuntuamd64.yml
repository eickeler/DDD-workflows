name: Create nightly .deb package for Ubuntu 24.04/26.04

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu24.04
            title: Ubuntu 24.04
            image: ubuntu:24.04
          - distro: ubuntu26.04
            title: Ubuntu 26.04
            image: ubuntu:26.04

    container:
      image: ${{ matrix.image }}

    env:
      DEBIAN_FRONTEND: noninteractive
      MIRROR_REPO: https://github.com/eickeler/DDD.git
      DISTRO: ${{ matrix.distro }}

    steps:
      - name: Install build dependencies

        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates \
            build-essential autoconf automake libtool libxpm-dev \
            libmotif-dev texinfo flex bison libtinyxml2-dev libxext-dev \
            libfreetype-dev libxft-dev libfontconfig-dev libncurses-dev \
            gawk



      - name: Checkout latest master

        run: |
          git clone --depth 1 --branch master "$MIRROR_REPO" ddd
          cd ddd

          DATE="$(date +%Y%m%d)"
          VERSION="3.5.0~rcX+git${DATE}+${DISTRO}"
          DEB_FILE="ddd-nightly-${DATE}_${VERSION}_amd64.deb"

          {
            echo "COMMIT=$(git rev-parse HEAD)"
            echo "DATE=$DATE"
            echo "VERSION=$VERSION"
            echo "DEB_FILE=$DEB_FILE"
          } >> "$GITHUB_ENV"

      - name: Build binaries

        working-directory: ddd
        run: |
          etc/prereq -maintainer
          autoreconf -ifv
          ./configure --prefix=/usr
          make -j"$(nproc)"



      - name: Create debian package structure

        working-directory: ddd
        run: |
          set -euo pipefail
          mkdir -p debian/ddd/DEBIAN
          mkdir -p debian/ddd/usr

          # Install to staging directory
          make install DESTDIR=$(pwd)/debian/ddd

          # Remove version number from install directory
          mv debian/ddd/usr/share/ddd-* debian/ddd/usr/share/ddd

          # gzip .info files
          gzip debian/ddd/usr/share/ddd/info/ddd*info*

          # dpkg-shlibdeps requires this packaging metadata.
          cat > debian/control <<'EOF'
          Source: ddd
          Section: devel
          Priority: optional
          Maintainer: DDD Maintainers <ddd@gnu.org>
          Standards-Version: 4.7.0

          Package: ddd
          Architecture: any
          Depends: ${shlibs:Depends}
          Description: Data Display Debugger
           Graphical front-end for command-line debuggers.
          EOF

          # Determine runtime library dependencies.
          SHLIB_OUTPUT="$(
            dpkg-shlibdeps -O -e debian/ddd/usr/bin/ddd
          )"

          DEPS="${SHLIB_OUTPUT#shlibs:Depends=}"

          if [[ "$SHLIB_OUTPUT" == "$DEPS" || -z "$DEPS" ]]; then
            echo "Failed to determine shared-library dependencies" >&2
            exit 1
          fi

          echo "Detected dependencies: $DEPS"

          # Create control file
          cat > debian/ddd/DEBIAN/control <<EOF
          Package: ddd
          Version: ${VERSION}
          Section: devel
          Priority: optional
          Architecture: amd64
          Depends: ${DEPS}, gdb, gnuplot
          Recommends: xterm, info, fonts-liberation
          Maintainer: DDD Maintainers (Michael Eager & Stefan Eickeler) <ddd@gnu.org>
          Description: Data Display Debugger - graphical debugger frontend
           DDD is a graphical front-end for command-line debuggers such as GDB.
           It provides source-level debugging and interactive graphical data
           displays for complex data structures and images.
          EOF

          # Build the .deb package
          dpkg-deb --build debian/ddd
          mv debian/ddd.deb "../${DEB_FILE}"



      - name: Test package

        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y "./${DEB_FILE}"
          dpkg-query -W -f='${Status}\n' ddd |
            grep -qx 'install ok installed'
          ddd --help

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.distro }}
          path: ${{ env.DEB_FILE }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      OWNER_REPO: ${{ github.repository }}

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          path: debs
          merge-multiple: true

      - name: Publish nightly release

        run: |
          set -euo pipefail

          DATE="$(
            basename "$(find debs -name '*.deb' | head -n1)" |
            grep -oE '[0-9]{8}' |
            head -n1
          )"
          TAG="nightly-${DATE}"

          if ! gh release view "$TAG" --repo "$OWNER_REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$OWNER_REPO" \
              --title "DDD Nightly $DATE" \
              --notes "Nightly packages for DDD." \
              --prerelease \
              --target "$GITHUB_SHA" \
            || gh release view "$TAG" --repo "$OWNER_REPO" >/dev/null
          fi

          gh release upload "$TAG" --repo "$OWNER_REPO" \
            debs/*.deb --clobber
