name: Create .deb packages for Ubuntu 24.04/26.04

on:
  workflow_call:
    inputs:
      ref:
        description: DDD branch or tag to build
        type: string
        default: master
      release:
        description: Build release packages (version without +git suffix)
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu24.04
            title: Ubuntu 24.04
            image: ubuntu:24.04
          - distro: ubuntu26.04
            title: Ubuntu 26.04
            image: ubuntu:26.04

    container:
      image: ${{ matrix.image }}

    env:
      DEBIAN_FRONTEND: noninteractive
      MIRROR_REPO: https://github.com/eickeler/DDD.git
      DISTRO: ${{ matrix.distro }}
      REF: ${{ inputs.ref || 'master' }}
      RELEASE: ${{ inputs.release && 'true' || 'false' }}

    steps:
      - name: Install build dependencies

        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates \
            build-essential autoconf automake libtool libxpm-dev \
            libmotif-dev texinfo flex bison libtinyxml2-dev libxext-dev \
            libfreetype-dev libxft-dev libfontconfig-dev libncurses-dev \
            gawk



      - name: Checkout DDD source

        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$REF" "$MIRROR_REPO" ddd
          cd ddd

          # Upstream version from AC_INIT, e.g. 3.5.0 or 3.5.0-rcX.
          BASE_VERSION="$(sed -n 's/^AC_INIT(\[ddd\],[[:space:]]*\[\([^]]*\)\].*/\1/p' configure.ac)"
          if [[ -z "$BASE_VERSION" ]]; then
            echo "Could not read the version from AC_INIT in configure.ac" >&2
            exit 1
          fi

          # '~' sorts a pre-release (3.5.0~rcX) below the release;
          # '+git' sorts a snapshot of a release (3.5.0+git...) above it.
          PKG_BASE="$(tr '-' '~' <<< "$BASE_VERSION")"

          DATE="$(date +%Y%m%d)"

          if [[ "$RELEASE" == true ]]; then
            # '~DISTRO' lets a future distribution package of the same
            # upstream version (1:3.5.0-1) take precedence over ours.
            VERSION="${PKG_BASE}-1~${DISTRO}"
            DEB_FILE="ddd_${PKG_BASE}-1_${DISTRO}_amd64.deb"
          else
            VERSION="${PKG_BASE}+git${DATE}+${DISTRO}"
            DEB_FILE="ddd-nightly-${DATE}_${VERSION}_amd64.deb"
          fi

          # Debian and Ubuntu ship ddd with epoch 1 (1:3.3.12-...).
          # Without the same epoch, apt treats that old package as newer.
          DEB_VERSION="1:${VERSION}"

          {
            echo "COMMIT=$(git rev-parse HEAD)"
            echo "DATE=$DATE"
            echo "VERSION=$VERSION"
            echo "DEB_VERSION=$DEB_VERSION"
            echo "DEB_FILE=$DEB_FILE"
          } >> "$GITHUB_ENV"

      - name: Build binaries

        working-directory: ddd
        run: |
          etc/prereq -maintainer
          autoreconf -ifv
          ./configure --prefix=/usr
          make -j"$(nproc)"



      - name: Create debian package structure

        working-directory: ddd
        run: |
          set -euo pipefail
          mkdir -p debian/ddd/DEBIAN
          mkdir -p debian/ddd/usr

          # Install to staging directory
          make install DESTDIR=$(pwd)/debian/ddd

          # Remove version number from install directory
          mv debian/ddd/usr/share/ddd-* debian/ddd/usr/share/ddd

          # gzip .info files
          gzip debian/ddd/usr/share/ddd/info/ddd*info*

          # dpkg-shlibdeps requires this packaging metadata.
          cat > debian/control <<'EOF'
          Source: ddd
          Section: devel
          Priority: optional
          Maintainer: DDD Maintainers <ddd@gnu.org>
          Standards-Version: 4.7.0

          Package: ddd
          Architecture: any
          Depends: ${shlibs:Depends}
          Description: Data Display Debugger
           Graphical front-end for command-line debuggers.
          EOF

          # Determine runtime library dependencies.
          SHLIB_OUTPUT="$(
            dpkg-shlibdeps -O -e debian/ddd/usr/bin/ddd
          )"

          DEPS="${SHLIB_OUTPUT#shlibs:Depends=}"

          if [[ "$SHLIB_OUTPUT" == "$DEPS" || -z "$DEPS" ]]; then
            echo "Failed to determine shared-library dependencies" >&2
            exit 1
          fi

          echo "Detected dependencies: $DEPS"

          # Create control file
          cat > debian/ddd/DEBIAN/control <<EOF
          Package: ddd
          Version: ${DEB_VERSION}
          Section: devel
          Priority: optional
          Architecture: amd64
          Depends: ${DEPS}, gdb, gnuplot
          Recommends: xterm, info, fonts-liberation
          Maintainer: DDD Maintainers (Michael Eager & Stefan Eickeler) <ddd@gnu.org>
          Description: Data Display Debugger - graphical debugger frontend
           DDD is a graphical front-end for command-line debuggers such as GDB.
           It provides source-level debugging and interactive graphical data
           displays for complex data structures and images.
          EOF

          # Build the .deb package
          dpkg-deb --build debian/ddd
          mv debian/ddd.deb "../${DEB_FILE}"



      - name: Test package

        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y "./${DEB_FILE}"
          dpkg-query -W -f='${Status}\n' ddd |
            grep -qx 'install ok installed'
          ddd --help

          # The distribution's own (old) ddd must not count as an upgrade.
          apt-cache policy ddd
          if apt list --upgradable 2>/dev/null | grep -q '^ddd/'; then
            echo "::error::apt would replace this package with the distribution's ddd"
            exit 1
          fi

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          # Published by the publish job of the calling workflow
          # (mirror.yml for nightlies, release.yml for releases).
          name: package-deb-${{ matrix.distro }}
          path: ${{ env.DEB_FILE }}
          if-no-files-found: error
