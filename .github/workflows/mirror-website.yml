name: Weekly DDD Website Mirror
 
on:
  schedule:
    # Every Monday at 03:17 UTC (deliberately not a full hour, to avoid load spikes)
    - cron: '17 3 * * 1'
  workflow_dispatch: {}  # allows manual trigger via the Actions UI
 
env:
  SOURCE_URL: https://www.gnu.org/software/ddd/
  TARGET_REPO: eickeler/DDD-website-mirror
  TARGET_BRANCH: main
 
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose connectivity
        run: |
          getent ahostsv4 www.gnu.org
          curl -4 -vI \
            --connect-timeout 30 \
            --max-time 60 \
            --retry 3 \
            --retry-all-errors \
            -A "DDD-website-mirror/1.0 (GitHub Actions; contact: eickeler@gnu.org)" \
            "${SOURCE_URL}"
            
      - name: Checkout target repository
        uses: actions/checkout@v5
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_BRANCH }}
          token: ${{ secrets.WEBSITE_MIRROR_TOKEN }}
          path: target-repo
          fetch-depth: 0
 
      - name: Create wget mirror of the website
        timeout-minutes: 20
        run: |
          mkdir -p mirror-tmp
          wget \
            --inet4-only \
            --recursive \
            --level=2 \
            --no-parent \
            --page-requisites \
            --convert-links \
            --adjust-extension \
            --no-host-directories \
            --directory-prefix=mirror-tmp \
            --timeout=20 \
            --tries=2 \
            --waitretry=5 \
            --wait=1 \
            --random-wait \
            -e robots=off \
            --no-verbose \
            "${SOURCE_URL}"
 
      - name: Remove old content (except .git)
        run: |
          cd target-repo
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
 
      - name: Copy in new mirror content
        run: |
          cp -a mirror-tmp/. target-repo/
 
      - name: Commit and push changes
        run: |
          cd target-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
 
          git add -A
 
          if git diff --cached --quiet; then
            echo "No changes to the website since the last run."
            exit 0
          fi
 
          COMMIT_DATE=$(date -u +"%Y-%m-%d")
          git commit -m "Website mirror from ${COMMIT_DATE}"
          git push origin "${TARGET_BRANCH}"
