name: Create .rpm package for RHEL 10

on:
  workflow_call:
    inputs:
      ref:
        description: DDD branch or tag to build
        type: string
        default: master
      release:
        description: Build release packages (version without +git suffix)
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    defaults:
      run:
        shell: bash

    container:
      image: almalinux:10

    env:
      MIRROR_REPO: https://github.com/eickeler/DDD.git
      REF: ${{ inputs.ref || 'master' }}
      RELEASE: ${{ inputs.release && 'true' || 'false' }}

    steps:
      - name: Install repositories and build dependencies
        run: |
          set -euo pipefail

          dnf -y install dnf-plugins-core

          # Development packages needed by DDD are provided by CRB.
          dnf config-manager --set-enabled crb

          # Motif and gnuplot are provided by EPEL.
          if ! dnf -y install epel-release; then
            dnf -y install \
              https://dl.fedoraproject.org/pub/epel/epel-release-latest-10.noarch.rpm
          fi

          dnf -y makecache

          dnf -y install \
            git \
            gcc \
            gcc-c++ \
            make \
            autoconf \
            automake \
            libtool \
            rpm-build \
            texinfo \
            flex \
            bison \
            gawk \
            gzip \
            tar \
            which \
            findutils \
            diffutils \
            file \
            motif-devel \
            libX11-devel \
            libXpm-devel \
            libXext-devel \
            libXt-devel \
            libXmu-devel \
            libXft-devel \
            freetype-devel \
            fontconfig-devel \
            ncurses-devel \
            tinyxml2-devel \
            gdb \
            gnuplot

      - name: Checkout DDD source
        run: |
          set -euo pipefail

          git clone --depth 1 --branch "$REF" "$MIRROR_REPO" ddd
          cd ddd

          # Upstream version from AC_INIT, e.g. 3.5.0 or 3.5.0-rcX.
          BASE_VERSION="$(sed -n 's/^AC_INIT(\[ddd\],[[:space:]]*\[\([^]]*\)\].*/\1/p' configure.ac)"
          if [[ -z "$BASE_VERSION" ]]; then
            echo "Could not read the version from AC_INIT in configure.ac" >&2
            exit 1
          fi

          # '~' sorts a pre-release (3.5.0~rcX) below the release;
          # '+git' sorts a snapshot of a release (3.5.0+git...) above it.
          PKG_BASE="$(tr '-' '~' <<< "$BASE_VERSION")"

          DATE="$(date +%Y%m%d)"

          if [[ "$RELEASE" == true ]]; then
            RPM_VERSION="${PKG_BASE}"
            PACKAGE_VERSION="${RPM_VERSION}-1.el10"
            RPM_FILE="ddd-${RPM_VERSION}-1.el10.x86_64.rpm"
          else
            RPM_VERSION="${PKG_BASE}+git${DATE}"
            PACKAGE_VERSION="${RPM_VERSION}+rhel10"
            RPM_FILE="ddd-nightly-${DATE}_${PACKAGE_VERSION}_x86_64.rpm"
          fi

          {
            echo "COMMIT=$(git rev-parse HEAD)"
            echo "DATE=$DATE"
            echo "RPM_VERSION=$RPM_VERSION"
            echo "PACKAGE_VERSION=$PACKAGE_VERSION"
            echo "RPM_FILE=$RPM_FILE"
          } >> "$GITHUB_ENV"

      - name: Build binaries
        working-directory: ddd
        run: |
          set -euo pipefail

          etc/prereq -maintainer
          autoreconf -ifv
          ./configure --prefix=/usr
          make -j"$(nproc)"

      - name: Create RPM package
        working-directory: ddd
        run: |
          set -euo pipefail

          STAGE="$(pwd)/stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"

          make install DESTDIR="$STAGE"

          # Remove the DDD version from the installed data directory.
          shopt -s nullglob
          DATA_DIRS=("$STAGE"/usr/share/ddd-*)

          if (( ${#DATA_DIRS[@]} != 1 )); then
            echo "Expected one versioned DDD data directory, found:" >&2
            printf '  %s\n' "${DATA_DIRS[@]}" >&2
            exit 1
          fi

          mv "${DATA_DIRS[0]}" "$STAGE/usr/share/ddd"

          cat > ddd.spec <<'EOF'
          %global debug_package %{nil}
          %global _build_id_links none

          Name:           ddd
          Version:        %{pkgver}
          Release:        1.el10
          Summary:        Data Display Debugger graphical frontend
          License:        GPL-3.0-or-later
          URL:            https://www.gnu.org/software/ddd/
          Distribution:   RHEL 10 compatible (built on AlmaLinux 10)
          Vendor:         DDD nightly builds

          Requires:       gdb
          Requires:       gnuplot
          Recommends:     xterm
          Recommends:     info
          Recommends:     liberation-fonts

          %description
          DDD is a graphical front-end for command-line debuggers such as GDB.
          It provides source-level debugging and interactive graphical data
          displays for complex data structures and images.

          %install
          rm -rf %{buildroot}
          mkdir -p %{buildroot}
          cp -a %{stage}/. %{buildroot}/

          rm -f \
            %{buildroot}/usr/share/info/dir \
            %{buildroot}/usr/lib/charset.alias

          # Compress the DDD Info files.
          if [ -d %{buildroot}/usr/share/ddd/info ]; then
            find %{buildroot}/usr/share/ddd/info \
              -type f \
              ! -name '*.gz' \
              -exec gzip -9n {} +
          fi

          # Compress manual pages before creating the RPM file list.
          if [ -d %{buildroot}/usr/share/man ]; then
            find %{buildroot}/usr/share/man \
              -type f \
              ! -name '*.gz' \
              -exec gzip -9n {} +
          fi

          # Include every installed file and symbolic link.
          (
            cd %{buildroot}
            find . \( -type f -o -type l \) -print |
              LC_ALL=C sort |
              sed 's|^\./|/|'
          ) > %{_builddir}/ddd.files

          # Own the application-specific data directories.
          if [ -d %{buildroot}/usr/share/ddd ]; then
            (
              cd %{buildroot}
              find usr/share/ddd -type d -print |
                LC_ALL=C sort |
                sed 's|^|%%dir /|'
            ) >> %{_builddir}/ddd.files
          fi

          %files -f %{_builddir}/ddd.files
          %defattr(-,root,root,-)
          EOF

          rm -rf rpmbuild

          rpmbuild -bb ddd.spec \
            --define "_topdir $(pwd)/rpmbuild" \
            --define "pkgver ${RPM_VERSION}" \
            --define "stage ${STAGE}"

          BUILT_RPM="$(
            find rpmbuild/RPMS \
              -type f \
              -name 'ddd-*.x86_64.rpm' \
              -print \
              -quit
          )"

          if [[ -z "$BUILT_RPM" ]]; then
            echo "No x86_64 RPM package was generated" >&2
            exit 1
          fi

          echo "Generated RPM: $BUILT_RPM"
          cp "$BUILT_RPM" "../${RPM_FILE}"

      - name: Test RPM package
        run: |
          set -euo pipefail

          dnf -y \
            --nogpgcheck \
            install "./${RPM_FILE}"

          rpm -q ddd
          rpm -V ddd

          rpm -q \
            --queryformat \
            'Package: %{NAME}\nVersion: %{VERSION}\nRelease: %{RELEASE}\nArchitecture: %{ARCH}\nDistribution: %{DISTRIBUTION}\n' \
            ddd

          ddd --help

          # The distribution's own (old) ddd must not count as an upgrade.
          # dnf check-update exits 100 if updates are available.
          rc=0
          dnf -q check-update ddd || rc=$?
          if (( rc == 100 )); then
            echo "::error::dnf would replace this package with the distribution's ddd"
            exit 1
          elif (( rc != 0 )); then
            echo "dnf check-update failed with exit code $rc" >&2
            exit 1
          fi

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          # Published by the publish job of the calling workflow
          # (mirror.yml for nightlies, release.yml for releases).
          name: package-rpm-rhel10-x86_64
          path: ${{ env.RPM_FILE }}
          if-no-files-found: error
