name: Create nightly .rpm packages for openSUSE

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: opensuse16.0
            package_suffix: opensuse16.0
            title: openSUSE Leap 16.0
            image: registry.opensuse.org/opensuse/leap:16.0

          - distro: tumbleweed
            package_suffix: opensuseTumbleweed
            title: openSUSE Tumbleweed
            image: registry.opensuse.org/opensuse/tumbleweed:latest

    container:
      image: ${{ matrix.image }}

    env:
      MIRROR_REPO: https://github.com/eickeler/DDD.git
      DISTRO: ${{ matrix.distro }}
      PACKAGE_SUFFIX: ${{ matrix.package_suffix }}
      DISTRO_TITLE: ${{ matrix.title }}

    steps:
      - name: Install build dependencies
        run: |
          set -euo pipefail

          zypper --non-interactive refresh
          zypper --non-interactive install --no-recommends \
            git tar gzip which findutils diffutils rpm-build \
            gcc gcc-c++ make autoconf automake libtool \
            texinfo flex bison gawk \
            motif-devel libXpm-devel libXext-devel libXt-devel libX11-devel \
            libXmu-devel libXft-devel freetype2-devel fontconfig-devel \
            ncurses-devel tinyxml2-devel

      - name: Checkout latest master
        run: |
          set -euo pipefail

          git clone --depth 1 --branch master "$MIRROR_REPO" ddd
          cd ddd

          DATE="$(date +%Y%m%d)"
          VERSION="3.5.0~rcX+git${DATE}"
          PACKAGE_VERSION="${VERSION}+${PACKAGE_SUFFIX}"
          RPM_FILE="ddd-nightly-${DATE}_${PACKAGE_VERSION}_x86_64.rpm"

          {
            echo "COMMIT=$(git rev-parse HEAD)"
            echo "DATE=$DATE"
            echo "VERSION=$VERSION"
            echo "PACKAGE_VERSION=$PACKAGE_VERSION"
            echo "RPM_FILE=$RPM_FILE"
          } >> "$GITHUB_ENV"

      - name: Build binaries
        working-directory: ddd
        run: |
          set -euo pipefail

          etc/prereq -maintainer
          autoreconf -ifv
          ./configure --prefix=/usr
          make

      - name: Create RPM package
        working-directory: ddd
        run: |
          set -euo pipefail

          # Install into the staging directory.
          STAGE="$(pwd)/stage"
          rm -rf "$STAGE"
          make install DESTDIR="$STAGE"

          # Remove the version number from the installed data directory.
          mv "$STAGE"/usr/share/ddd-* "$STAGE/usr/share/ddd"

          # The distribution is stored in Release and Distribution.
          # Shared-library dependencies are generated automatically by RPM.
          cat > ddd.spec <<'EOF'
          %global debug_package %{nil}
          %global _build_id_links none

          Name:         ddd
          Version:      %{pkgver}
          Release:      1.%{distro}
          Summary:      Data Display Debugger - graphical debugger frontend
          License:      GPL-3.0-or-later
          URL:          https://www.gnu.org/software/ddd/
          Distribution: %{disttitle}

          Requires:     gdb
          Requires:     gnuplot
          Recommends:   xterm
          Recommends:   info
          Recommends:   liberation-fonts

          %description
          DDD is a graphical front-end for command-line debuggers such as GDB.
          It provides source-level debugging and interactive graphical data
          displays for complex data structures and images.

          %install
          mkdir -p %{buildroot}
          cp -a %{stage}/. %{buildroot}/

          rm -f \
            %{buildroot}/usr/share/info/dir \
            %{buildroot}/usr/lib/charset.alias

          # Compress Info and manual pages.
          find %{buildroot}/usr/share \
            -path '*/info/*' \
            -type f \
            ! -name '*.gz' \
            ! -name dir \
            -exec gzip -9n {} +

          if [ -d %{buildroot}/usr/share/man ]; then
            find %{buildroot}/usr/share/man \
              -type f \
              ! -name '*.gz' \
              -exec gzip -9n {} +
          fi

          # Generate the RPM file list.
          (
            cd %{buildroot}
            find . \( -type f -o -type l \) | sed 's|^\.||'
          ) > %{_builddir}/ddd.files

          (
            cd %{buildroot}
            find usr/share/ddd -type d | sed 's|^|%%dir /|'
          ) >> %{_builddir}/ddd.files

          %files -f %{_builddir}/ddd.files
          %defattr(-,root,root,-)
          EOF

          rpmbuild -bb ddd.spec \
            --define "_topdir $(pwd)/rpmbuild" \
            --define "pkgver ${VERSION}" \
            --define "distro ${DISTRO}" \
            --define "disttitle ${DISTRO_TITLE}" \
            --define "stage ${STAGE}"

          BUILT_RPM="$(find rpmbuild/RPMS/x86_64 -maxdepth 1 \
            -type f -name 'ddd-*.rpm' -print -quit)"

          if [[ -z "$BUILT_RPM" ]]; then
            echo "No RPM package was generated" >&2
            exit 1
          fi

          cp "$BUILT_RPM" "../${RPM_FILE}"

      - name: Test package
        run: |
          set -euo pipefail

          zypper --non-interactive \
            --no-gpg-checks \
            install \
            --allow-unsigned-rpm \
            "./${RPM_FILE}"

          rpm -q ddd

          rpm -q \
            --queryformat \
            'Package: %{NAME}\nVersion: %{VERSION}\nRelease: %{RELEASE}\nArchitecture: %{ARCH}\nDistribution: %{DISTRIBUTION}\n' \
            ddd

          ddd --help

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.distro }}
          path: ${{ env.RPM_FILE }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04

    env:
      GH_TOKEN: ${{ github.token }}
      OWNER_REPO: ${{ github.repository }}

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: rpm-*
          path: rpms
          merge-multiple: true

      - name: Publish nightly release
        run: |
          set -euo pipefail

          shopt -s nullglob
          RPM_FILES=(rpms/*.rpm)

          if (( ${#RPM_FILES[@]} == 0 )); then
            echo "No RPM packages were downloaded" >&2
            exit 1
          fi

          DATE="$(
            basename "${RPM_FILES[0]}" |
              grep -oE '[0-9]{8}' |
              head -n1
          )"

          if [[ -z "$DATE" ]]; then
            echo "Could not determine package date" >&2
            exit 1
          fi

          TAG="nightly-${DATE}"

          if ! gh release view "$TAG" \
            --repo "$OWNER_REPO" >/dev/null 2>&1; then

            gh release create "$TAG" \
              --repo "$OWNER_REPO" \
              --title "DDD Nightly $DATE" \
              --notes "Nightly packages for DDD." \
              --prerelease \
              --target "$GITHUB_SHA" \
            || gh release view "$TAG" \
              --repo "$OWNER_REPO" >/dev/null
          fi

          gh release upload "$TAG" \
            --repo "$OWNER_REPO" \
            "${RPM_FILES[@]}" \
            --clobber
